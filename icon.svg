<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Background rounded square -->
  <rect width="512" height="512" rx="108" fill="#111114"/>

  <!-- Barbell plate motif (subtle) -->
  <circle cx="256" cy="256" r="160" fill="none" stroke="#222228" stroke-width="8"/>
  <circle cx="256" cy="256" r="120" fill="none" stroke="#1a1a1f" stroke-width="6"/>

  <!-- Bold geometric P -->
  <text x="256" y="310"
    font-family="'Space Mono', 'Courier New', monospace"
    font-size="280"
    font-weight="700"
    fill="#FF6B35"
    text-anchor="middle"
    dominant-baseline="central"
    letter-spacing="-8">P</text>

  <!-- Accent bar (barbell detail) -->
  <rect x="140" y="390" width="232" height="6" rx="3" fill="#FF6B35" opacity="0.6"/>
</svg>
